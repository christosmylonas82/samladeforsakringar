services:
  postgres:
    image: postgres:16-alpine
    container_name: samladeforsakringar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samladeforsakringar
    ports:
      - "5432:5432"
    volumes:
      - samladeforsakringar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  samladeforsakringar_postgres_data:
